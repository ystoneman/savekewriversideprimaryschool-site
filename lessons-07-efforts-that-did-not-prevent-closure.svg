<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">When an alternative did not keep a school open</title><desc id="desc">Cowes had a petition and councillor representation but closed. Broad Oak submitted a federation budget, rejected on financial and delivery grounds. St Bartholomew’s proposed a smaller school and pursued adjudication; it obtained one extra term, then closed. De Beauvoir merger suggestions and wider opposition did not change the council’s conclusion. These are case observations, not estimates of tactic effectiveness.</desc>
<rect x="0" y="0" width="1600" height="1000" rx="0" fill="#fbfaf6"/>
<rect x="64" y="55" width="70" height="6" rx="0" fill="#0e6470"/>
<text x="150" y="66" fill="#0e6470" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" text-anchor="start">KEW RIVERSIDE PRIMARY SCHOOL  /  HISTORICAL EVIDENCE  /  EXHIBIT 07</text>
<text x="64" y="132" fill="#183733" font-family="Arial,Helvetica,sans-serif" font-size="44" font-weight="700" text-anchor="start">When an alternative did not keep a school open</text>
<text x="64" y="179" fill="#62726e" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400" text-anchor="start">Four selected comparisons. Recorded assessments are attributed; these cases do not measure tactic effectiveness.</text>
<rect x="64" y="222" width="718" height="291" rx="9" fill="#ffffff" stroke="#dce3da"/>
<text x="88" y="262" fill="#183733" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" text-anchor="start">Cowes</text>
<text x="88" y="295" fill="#a45012" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" text-anchor="start">Closed 31 Aug 2025</text>
<text x="88" y="330" fill="#0e6470" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" text-anchor="start">WHAT WAS TRIED</text>
<text x="88" y="361" fill="#183733" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400" text-anchor="start">479 online signatures; councillor representation.</text>
<text x="88" y="423" fill="#0e6470" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" text-anchor="start">ASSESSMENT IN THE RECORD</text>
<text x="88" y="453" fill="#183733" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" text-anchor="start">Notice: falling rolls and surplus places. Cabinet approved closure.</text>
<text x="754" y="499" fill="#52665d" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" text-anchor="end">S05, S27-S29, G12</text>
<rect x="818" y="222" width="718" height="291" rx="9" fill="#ffffff" stroke="#dce3da"/>
<text x="842" y="262" fill="#183733" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" text-anchor="start">Broad Oak</text>
<text x="842" y="295" fill="#a45012" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" text-anchor="start">Closed 31 Aug 2020</text>
<text x="842" y="330" fill="#0e6470" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" text-anchor="start">WHAT WAS TRIED</text>
<text x="842" y="361" fill="#183733" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400" text-anchor="start">Two classes, shared leadership and a federation budget.</text>
<text x="842" y="423" fill="#0e6470" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" text-anchor="start">ASSESSMENT IN THE RECORD</text>
<text x="842" y="453" fill="#183733" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" text-anchor="start">Council: later deficit, leadership gaps and insufficient evidence for extra</text>
<text x="842" y="480" fill="#183733" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" text-anchor="start">pupils.</text>
<text x="1508" y="499" fill="#52665d" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" text-anchor="end">S24, G13</text>
<rect x="64" y="534" width="718" height="291" rx="9" fill="#ffffff" stroke="#dce3da"/>
<text x="88" y="574" fill="#183733" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" text-anchor="start">St Bartholomew’s</text>
<text x="88" y="607" fill="#a45012" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" text-anchor="start">Extra term; closed 31 Dec 2024</text>
<text x="88" y="642" fill="#0e6470" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" text-anchor="start">WHAT WAS TRIED</text>
<text x="88" y="673" fill="#183733" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400" text-anchor="start">Smaller-school plan, external referral and transition arguments.</text>
<text x="88" y="735" fill="#0e6470" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" text-anchor="start">ASSESSMENT IN THE RECORD</text>
<text x="88" y="765" fill="#183733" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" text-anchor="start">Adjudicators accepted closure grounds, but allowed more transition</text>
<text x="88" y="792" fill="#183733" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" text-anchor="start">time.</text>
<text x="754" y="811" fill="#52665d" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" text-anchor="end">S23, G14</text>
<rect x="818" y="534" width="718" height="291" rx="9" fill="#ffffff" stroke="#dce3da"/>
<text x="842" y="574" fill="#183733" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" text-anchor="start">De Beauvoir</text>
<text x="842" y="607" fill="#a45012" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" text-anchor="start">Closed 31 Aug 2024</text>
<text x="842" y="642" fill="#0e6470" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" text-anchor="start">WHAT WAS TRIED</text>
<text x="842" y="673" fill="#183733" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400" text-anchor="start">Alternative merger pairings; opposition to the wider package.</text>
<text x="842" y="735" fill="#0e6470" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" text-anchor="start">ASSESSMENT IN THE RECORD</text>
<text x="842" y="765" fill="#183733" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" text-anchor="start">Council: distance and stabilising rolls limited the suggested</text>
<text x="842" y="792" fill="#183733" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" text-anchor="start">alternatives.</text>
<text x="1508" y="811" fill="#52665d" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" text-anchor="end">S25-S26, S30, G15</text>
<text x="64" y="883" fill="#183733" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" text-anchor="start">A concession still matters: St Bartholomew’s gained an extra term to support transition.</text>
<line x1="64" y1="910" x2="1536" y2="910" stroke="#dce3da" stroke-width="2"/>
<text x="64" y="940" fill="#62726e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start">Full efforts, exact source locations, outcomes and limitations are in the closure comparisons and citations appendix.</text>
<text x="64" y="986" fill="#62726e" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" text-anchor="start">These are contextual comparisons, not matched controls. “Did not prevent closure” does not mean “had no benefit”.</text>
</svg>