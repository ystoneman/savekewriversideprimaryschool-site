<text x="64" y="878" fill="#183733" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" text-anchor="start">£74,368 raised or committed in total. Later deficits remained in both pupil scenarios.</text>
<line x1="64" y1="910" x2="1536" y2="910" stroke="#dce3da" stroke-width="2"/>
<text x="64" y="940" fill="#62726e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start">Sources: S01 sections 3.10 and 7.3; S02 confirms the December 2019 decision to stop consultation.</text>
<text x="64" y="986" fill="#62726e" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" text-anchor="start">Budget changes also reflect other assumptions. The range is not a confidence interval. No Kew funding target is implied.</text>
