<text x="64" y="132" fill="#183733" font-family="Arial,Helvetica,sans-serif" font-size="44" font-weight="700" text-anchor="start">A stronger forecast is not yet a sustainable budget</text>
<text x="64" y="179" fill="#62726e" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400" text-anchor="start">Fletching | December 2019 forecasts of year-end balance, in pounds. These are not actual results.</text>
