<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">A stronger forecast is not yet a sustainable budget</title><desc id="desc">Original forecasts were minus £5,457, minus £62,138 and minus £145,863. Revised forecasts were £40,920, minus £3,299 and between minus £95,588 and minus £39,338. Support comprised £44,368 raised, £20,000 pledged by a trust and a £10,000 parish resolution.</desc>
