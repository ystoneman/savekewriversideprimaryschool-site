<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">Stopping a proposal is only the first milestone</title><desc id="desc">On 30 June 2026 the adjudicator rejected the Hazlewood merger proposal but said closure should follow without capital for replacement buildings. A renewed closure proposal was reported on 15 September 2026. The school remained open in GIAS on 22 September 2026.</desc>
<rect x="0" y="0" width="1600" height="1000" rx="0" fill="#fbfaf6"/>
<rect x="64" y="55" width="70" height="6" rx="0" fill="#0e6470"/>
<text x="150" y="66" fill="#0e6470" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" text-anchor="start">KEW RIVERSIDE PRIMARY SCHOOL  /  HISTORICAL EVIDENCE  /  EXHIBIT 05</text>
<text x="64" y="132" fill="#183733" font-family="Arial,Helvetica,sans-serif" font-size="44" font-weight="700" text-anchor="start">Stopping a proposal is only the first milestone</text>
<text x="64" y="179" fill="#62726e" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400" text-anchor="start">Hazlewood shows why a rejected proposal and a lasting turnaround need separate labels.</text>
<line x1="135" y1="286" x2="1465" y2="286" stroke="#aabcb2" stroke-width="5"/>
<circle cx="135" cy="286" r="15" fill="#0e6470"/>
<text x="81" y="340" fill="#0e6470" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" text-anchor="start">30 JUN 2026</text>
<text x="81" y="397" fill="#183733" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" text-anchor="start">Proposal rejected</text>
<text x="81" y="470" fill="#183733" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="400" text-anchor="start">The proposed merger was</text>
<text x="81" y="508" fill="#183733" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="400" text-anchor="start">rejected by the adjudicator.</text>
<text x="81" y="649" fill="#62726e" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" text-anchor="start">S15</text>
<circle cx="635" cy="286" r="15" fill="#b4641d"/>
<text x="581" y="340" fill="#b4641d" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" text-anchor="start">SAME DETERMINATION</text>
<text x="581" y="397" fill="#183733" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" text-anchor="start">Problem remains</text>
<text x="581" y="470" fill="#183733" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="400" text-anchor="start">Without capital for replacement</text>
<text x="581" y="508" fill="#183733" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="400" text-anchor="start">buildings, the adjudicator</text>
<text x="581" y="546" fill="#183733" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="400" text-anchor="start">considered future closure</text>
<text x="581" y="584" fill="#183733" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="400" text-anchor="start">necessary.</text>
<text x="581" y="649" fill="#62726e" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" text-anchor="start">S15, paragraphs 72-73</text>
<circle cx="1135" cy="286" r="15" fill="#b4641d"/>
<text x="1081" y="340" fill="#b4641d" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" text-anchor="start">15 SEP 2026</text>
<text x="1081" y="397" fill="#183733" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" text-anchor="start">Closure proposed again</text>
<text x="1081" y="470" fill="#183733" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="400" text-anchor="start">A renewed closure proposal</text>
<text x="1081" y="508" fill="#183733" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="400" text-anchor="start">was reported. The register still</text>
<text x="1081" y="546" fill="#183733" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="400" text-anchor="start">listed the school as open on 22</text>
<text x="1081" y="584" fill="#183733" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="400" text-anchor="start">September.</text>
<text x="1081" y="649" fill="#62726e" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" text-anchor="start">S16; GIAS</text>
<rect x="64" y="737" width="1472" height="128" rx="3" fill="#143936"/>
<text x="93" y="782" fill="#d9f2c7" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700" text-anchor="start">Track two outcomes separately</text>
<text x="93" y="829" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="400" text-anchor="start">1  Has this proposal stopped?</text>
<text x="720" y="829" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="400" text-anchor="start">2  Is continuing provision sustainable?</text>
<line x1="64" y1="910" x2="1536" y2="910" stroke="#dce3da" stroke-width="2"/>
<text x="64" y="940" fill="#62726e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start">Sources: STP663 (S15); BBC follow-up syndicated by Yahoo on 15 September 2026 (S16); GIAS URN 108610.</text>
<text x="64" y="986" fill="#62726e" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" text-anchor="start">Hazlewood remains in the historical reprieve catalogue, with the renewed threat stated. No prediction of eventual closure is made here.</text>
</svg>