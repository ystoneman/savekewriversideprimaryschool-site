<title id="title">What the decision records actually say</title><desc id="desc">Nine episodes are coded against six factors. Filled squares mean explicit decision rationale; outlined circles mean discussed or part of the route; dashes mean not established. Factors overlap and are not causal effect estimates.</desc>
