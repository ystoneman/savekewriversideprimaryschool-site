name: Validate and deploy Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Test privacy and security guards
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Check JavaScript syntax
        run: for script in *.js .github/scripts/old_site_redirect.js; do node --check "$script"; done
      - name: Validate and stage only public assets
        run: python3 .github/scripts/check_site.py --stage "$RUNNER_TEMP/public-site"
      - name: Upload checked site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/public-site
          retention-days: 1

  browser-shards:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        project: [iphone-webkit, android-chromium, desktop-chromium, desktop-webkit, iphone-no-javascript]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned test dependencies
        run: npm ci --ignore-scripts
      - name: Install browser engines
        run: |
          case "${{ matrix.project }}" in
            *webkit*|iphone-no-javascript) npx playwright install --with-deps webkit ;;
            *) npx playwright install --with-deps chromium ;;
          esac
      - name: Test navigation and visitor journeys
        run: npm test -- --project="${{ matrix.project }}"
      - name: Save browser report and failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-test-failures-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  browser-tests:
    if: ${{ always() }}
    needs: browser-shards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every browser project to pass
        env:
          BROWSER_RESULT: ${{ needs.browser-shards.result }}
        run: test "$BROWSER_RESULT" = success

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [validate, browser-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy validated artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  compatibility:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Create scoped legacy deployment token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        id: legacy-token
        with:
          app-id: ${{ secrets.LEGACY_DEPLOY_APP_ID }}
          private-key: ${{ secrets.LEGACY_DEPLOY_APP_PRIVATE_KEY }}
          owner: ystoneman
          repositories: |
            kew-riverside-website
            savekewriverside-site
          permission-actions: write
      - name: Update changed compatibility assets and verify every copy
        env:
          GH_TOKEN: ${{ steps.legacy-token.outputs.token }}
        run: python3 .github/scripts/compatibility_release.py synchronize --sha "${{ github.sha }}" --run-id "${{ github.run_id }}"
