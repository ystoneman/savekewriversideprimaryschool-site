name: Validate and deploy Pages
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  # New PR revisions replace obsolete checks; active production releases are not cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      reuse: ${{ steps.reuse.outputs.reuse }}
      proof_run: ${{ steps.reuse.outputs.proof_run }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Test privacy and security guards
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Test aggregate collector privacy and storage
        run: node --test analytics-backend/worker.test.mjs
      - name: Test automatic homepage deadline transitions
        run: node --test tests/unit/home-landing.test.cjs
      - name: Check JavaScript syntax
        run: for script in *.js .github/scripts/old_site_redirect.js; do node --check "$script"; done
      - name: Validate and stage only public assets
        run: python3 .github/scripts/check_site.py --stage "$RUNNER_TEMP/public-site"
      - name: Capture validation evidence
        if: github.event_name == 'pull_request'
        run: python3 .github/scripts/pr_browser_reuse.py capture --site "$RUNNER_TEMP/public-site" --out "$RUNNER_TEMP/validation-evidence/evidence.json"
      - name: Save validation evidence
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr-evidence-${{ github.run_id }}-${{ github.run_attempt }}-validate-1
          path: ${{ runner.temp }}/validation-evidence/evidence.json
          if-no-files-found: error
          retention-days: 2
      - name: Verify reusable PR browser results
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/pr_browser_reuse.py probe --site "$RUNNER_TEMP/public-site"
      - name: Upload checked site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/public-site
          retention-days: 1

  browser-shards:
    needs: validate
    if: needs.validate.outputs.reuse != 'true'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: iphone-webkit, shard: 1, total: 3 }
          - { project: iphone-webkit, shard: 2, total: 3 }
          - { project: iphone-webkit, shard: 3, total: 3 }
          - { project: desktop-webkit, shard: 1, total: 3 }
          - { project: desktop-webkit, shard: 2, total: 3 }
          - { project: desktop-webkit, shard: 3, total: 3 }
          - { project: android-chromium, shard: 1, total: 1 }
          - { project: desktop-chromium, shard: 1, total: 1 }
          - { project: iphone-no-javascript, shard: 1, total: 1 }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Trust only the checkout path inside the browser container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned test dependencies
        run: npm ci --ignore-scripts
      - name: Install browser engines
        run: |
          case "${{ matrix.project }}" in
            *webkit*|iphone-no-javascript) npx playwright install webkit ;;
            *) npx playwright install chromium ;;
          esac
      - name: Capture browser inputs
        if: github.event_name == 'pull_request'
        run: python3 .github/scripts/pr_browser_reuse.py capture --project="${{ matrix.project }}" --shard="${{ matrix.shard }}" --total="${{ matrix.total }}" --out "$RUNNER_TEMP/browser-inputs.json"
      - name: Test navigation and visitor journeys
        run: npm test -- --project="${{ matrix.project }}" --shard="${{ matrix.shard }}/${{ matrix.total }}"
      - name: Seal browser evidence
        if: github.event_name == 'pull_request'
        run: python3 .github/scripts/pr_browser_reuse.py seal --project="${{ matrix.project }}" --shard="${{ matrix.shard }}" --total="${{ matrix.total }}" --before "$RUNNER_TEMP/browser-inputs.json" --out "$RUNNER_TEMP/browser-evidence/evidence.json"
      - name: Save browser evidence
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr-evidence-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.project }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/browser-evidence/evidence.json
          if-no-files-found: error
          retention-days: 2
      - name: Save browser report and failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-test-failures-${{ matrix.project }}-${{ matrix.shard }}-of-${{ matrix.total }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  browser-tests:
    if: ${{ always() }}
    needs: [validate, browser-shards]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Require complete browser coverage
        env:
          VALIDATION_RESULT: ${{ needs.validate.result }}
          BROWSER_RESULT: ${{ needs.browser-shards.result }}
          REUSE: ${{ needs.validate.outputs.reuse }}
          PROOF_RUN: ${{ needs.validate.outputs.proof_run }}
        run: python3 .github/scripts/pr_browser_reuse.py gate

  deploy:
    if: ${{ !cancelled() && needs.validate.result == 'success' && needs.browser-tests.result == 'success' && github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    needs: [validate, browser-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy validated artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  compatibility:
    if: ${{ !cancelled() && needs.deploy.result == 'success' && github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Create scoped legacy deployment token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        id: legacy-token
        with:
          app-id: ${{ secrets.LEGACY_DEPLOY_APP_ID }}
          private-key: ${{ secrets.LEGACY_DEPLOY_APP_PRIVATE_KEY }}
          owner: ystoneman
          repositories: |
            kew-riverside-website
            savekewriverside-site
          permission-actions: write
      - name: Update changed compatibility assets and verify every copy
        env:
          GH_TOKEN: ${{ steps.legacy-token.outputs.token }}
        run: python3 .github/scripts/compatibility_release.py synchronize --sha "${{ github.sha }}" --run-id "${{ github.run_id }}"
