<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">Turn support into evidence a decision-maker can use</title><desc id="desc">Start a costed operating plan and audit demand and closure savings. In parallel document effects on families and prepare formal submissions. Seek specialist process advice if a specific issue is evidenced. Historical frequency does not estimate the impact of these actions.</desc>
<rect x="0" y="0" width="1600" height="1000" rx="0" fill="#fbfaf6"/>
<rect x="64" y="55" width="70" height="6" rx="0" fill="#0e6470"/>
<text x="150" y="66" fill="#0e6470" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" text-anchor="start">KEW RIVERSIDE PRIMARY SCHOOL  /  HISTORICAL EVIDENCE  /  EXHIBIT 06</text>
<text x="64" y="132" fill="#183733" font-family="Arial,Helvetica,sans-serif" font-size="44" font-weight="700" text-anchor="start">Turn support into evidence a decision-maker can use</text>
<text x="64" y="179" fill="#62726e" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400" text-anchor="start">A suggested work plan for Kew Riverside Primary School. Editorial synthesis, not a ranking of proven effectiveness.</text>
<text x="64" y="230" fill="#143936" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" text-anchor="start">START NOW</text>
<rect x="64" y="252" width="718" height="157" rx="9" fill="#edf2e9"/>
<text x="90" y="297" fill="#183733" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" text-anchor="start">Cost an operating alternative</text>
<text x="90" y="338" fill="#183733" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" text-anchor="start">Three-year budget; staffing, pupil scenarios and evidenced</text>
<text x="90" y="371" fill="#183733" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" text-anchor="start">funding.</text>
<rect x="818" y="252" width="718" height="157" rx="9" fill="#edf2e9"/>
<text x="844" y="297" fill="#183733" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" text-anchor="start">Test the closure assumptions</text>
<text x="844" y="338" fill="#183733" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" text-anchor="start">Pupil forecasts, likely family destinations and net savings,</text>
<text x="844" y="371" fill="#183733" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" text-anchor="start">including PFI.</text>
<text x="64" y="458" fill="#0e6470" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" text-anchor="start">IN PARALLEL</text>
<rect x="64" y="480" width="718" height="157" rx="9" fill="#edf2e9"/>
<text x="90" y="525" fill="#183733" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" text-anchor="start">Document effects on families</text>
<text x="90" y="566" fill="#183733" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" text-anchor="start">Aggregated journeys, SEND continuity and community use;</text>
<text x="90" y="599" fill="#183733" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" text-anchor="start">protect identities.</text>
<rect x="818" y="480" width="718" height="157" rx="9" fill="#edf2e9"/>
<text x="844" y="525" fill="#183733" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" text-anchor="start">Prepare the official response</text>
<text x="844" y="566" fill="#183733" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" text-anchor="start">Numbered sources, a costed alternative and specific</text>
<text x="844" y="599" fill="#183733" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" text-anchor="start">questions to answer.</text>
<rect x="64" y="712" width="1472" height="134" rx="9" fill="#fbf0d6"/>
<text x="90" y="750" fill="#a45012" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" text-anchor="start">IF A SPECIFIC ISSUE IS EVIDENCED</text>
<text x="90" y="791" fill="#183733" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" text-anchor="start">Check the process and the available remedy.</text>
<text x="90" y="826" fill="#183733" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400" text-anchor="start">Keep a dated decision log; check the current rules and who is eligible to use each route.</text>
<line x1="64" y1="910" x2="1536" y2="910" stroke="#dce3da" stroke-width="2"/>
<text x="64" y="940" fill="#62726e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start">Case basis: Fletching (S01); Arreton (S07); St John the Divine (S08); Pooles Park (S11); current guidance (S17-S18).</text>
<text x="64" y="986" fill="#62726e" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" text-anchor="start">Kew is a community school. Historic faith-school referrals and rural protections are not automatic routes for Kew families.</text>
</svg>