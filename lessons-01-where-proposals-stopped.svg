<text x="88" y="861" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400" text-anchor="start">This catalogue cannot estimate Kew’s probability of remaining open.</text>
<line x1="64" y1="910" x2="1536" y2="910" stroke="#dce3da" stroke-width="2"/>
<text x="64" y="940" fill="#62726e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start">Sources: S01-S16; GIAS status checks on 22 September 2026. See data/catalogue.json and the source register.</text>
<text x="64" y="986" fill="#62726e" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" text-anchor="start">Unit: school. External interventions have different eligibility rules. “Open” does not establish financial recovery.</text>
