<text x="64" y="132" fill="#183733" font-family="Arial,Helvetica,sans-serif" font-size="44" font-weight="700" text-anchor="start">Closure proposals can stop at several stages</text>
<text x="64" y="179" fill="#62726e" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400" text-anchor="start">12 selected English schools, 2019-2026; 9 grouped decision episodes across 6 local authorities.</text>
<text x="64" y="270" fill="#183733" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" text-anchor="start">Initial consultation</text>
<text x="64" y="311" fill="#62726e" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" text-anchor="start">Fletching; Godshill; St George’s, Langton</text>
<text x="64" y="344" fill="#62726e" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" text-anchor="start">Closest stage to Kew Riverside Primary School today</text>
