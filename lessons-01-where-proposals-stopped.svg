<text x="64" y="489" fill="#62726e" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" text-anchor="start">Brading; Oakfield; Wroxall</text>
<text x="64" y="522" fill="#62726e" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" text-anchor="start">Three schools in one Cabinet episode</text>
