<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">Closure proposals can stop at several stages</title><desc id="desc">Three schools were retained during initial consultation, three at a local decision after statutory notice, and six following external intervention. These are counts within a selected catalogue, not national success rates.</desc>
<rect x="0" y="0" width="1600" height="1000" rx="0" fill="#fbfaf6"/>
<rect x="64" y="55" width="70" height="6" rx="0" fill="#0e6470"/>
