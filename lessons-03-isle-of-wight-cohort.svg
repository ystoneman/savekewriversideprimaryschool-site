<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">Six schools. Four routes through one local programme.</title><desc id="desc">Of six schools, Godshill was removed before statutory notice; Brading, Oakfield and Wroxall were retained by Cabinet; Arreton was retained after adjudication; Cowes closed on 31 August 2025. This local cohort is not representative of England.</desc>
<rect x="0" y="0" width="1600" height="1000" rx="0" fill="#fbfaf6"/>
<rect x="64" y="55" width="70" height="6" rx="0" fill="#0e6470"/>
<text x="150" y="66" fill="#0e6470" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" text-anchor="start">KEW RIVERSIDE PRIMARY SCHOOL  /  HISTORICAL EVIDENCE  /  EXHIBIT 03</text>
<text x="64" y="132" fill="#183733" font-family="Arial,Helvetica,sans-serif" font-size="44" font-weight="700" text-anchor="start">Six schools. Four routes through one local programme.</text>
<text x="64" y="179" fill="#62726e" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400" text-anchor="start">The six schools named in the Isle of Wight’s 2024 closure programme, followed through August 2025.</text>
<text x="64" y="295" fill="#143936" font-family="Arial,Helvetica,sans-serif" font-size="100" font-weight="700" text-anchor="start">6</text>
<text x="160" y="270" fill="#183733" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" text-anchor="start">schools originally</text>
<text x="160" y="311" fill="#183733" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" text-anchor="start">proposed for closure</text>
<line x1="360" y1="356" x2="360" y2="780" stroke="#aabcb2" stroke-width="4"/>
<line x1="360" y1="375" x2="440" y2="375" stroke="#aabcb2" stroke-width="4"/>
<circle cx="360" cy="375" r="7" fill="#0e6470"/>
<rect x="455" y="338" width="66" height="67" rx="3" fill="#0e6470"/>
<text x="488" y="386" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="42" font-weight="700" text-anchor="middle">1</text>
<text x="553" y="369" fill="#183733" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" text-anchor="start">Godshill</text>
<text x="553" y="406" fill="#62726e" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400" text-anchor="start">Removed before statutory notice</text>
<text x="1526" y="383" fill="#62726e" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" text-anchor="end">12 Dec 2024</text>
<line x1="360" y1="492" x2="440" y2="492" stroke="#aabcb2" stroke-width="4"/>
<circle cx="360" cy="492" r="7" fill="#143936"/>
<rect x="455" y="455" width="66" height="67" rx="3" fill="#143936"/>
<text x="488" y="503" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="42" font-weight="700" text-anchor="middle">3</text>
<text x="553" y="486" fill="#183733" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" text-anchor="start">Brading · Oakfield · Wroxall</text>
<text x="553" y="523" fill="#62726e" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400" text-anchor="start">Cabinet decided not to proceed</text>
<text x="1526" y="500" fill="#62726e" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" text-anchor="end">20 Mar 2025</text>
<line x1="360" y1="609" x2="440" y2="609" stroke="#aabcb2" stroke-width="4"/>
<circle cx="360" cy="609" r="7" fill="#0e6470"/>
<rect x="455" y="572" width="66" height="67" rx="3" fill="#0e6470"/>
<text x="488" y="620" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="42" font-weight="700" text-anchor="middle">1</text>
<text x="553" y="603" fill="#183733" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" text-anchor="start">Arreton St George’s</text>
<text x="553" y="640" fill="#62726e" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400" text-anchor="start">Adjudicator rejected closure</text>
<text x="1526" y="617" fill="#62726e" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" text-anchor="end">23 Jun 2025</text>
<line x1="360" y1="726" x2="440" y2="726" stroke="#aabcb2" stroke-width="4"/>
<circle cx="360" cy="726" r="7" fill="#b4641d"/>
<rect x="455" y="689" width="66" height="67" rx="3" fill="#b4641d"/>
<text x="488" y="737" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="42" font-weight="700" text-anchor="middle">1</text>
<text x="553" y="720" fill="#183733" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" text-anchor="start">Cowes</text>
<text x="553" y="757" fill="#62726e" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400" text-anchor="start">School closed; confirmed by GIAS</text>
<text x="1526" y="734" fill="#62726e" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" text-anchor="end">31 Aug 2025</text>
<text x="64" y="856" fill="#183733" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" text-anchor="start">Five proposals stopped; one school closed. This is a bounded local comparison, not a national rate.</text>
<line x1="64" y1="910" x2="1536" y2="910" stroke="#dce3da" stroke-width="2"/>
<text x="64" y="940" fill="#62726e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start">Sources: S03-S07, S28 and G12. Five retained schools listed open in GIAS on 22 September 2026.</text>
<text x="64" y="986" fill="#62726e" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" text-anchor="start">Unit: original school proposal. Sequence is not drawn to a time scale. Long-term finances and future reviews are separate questions.</text>
</svg>