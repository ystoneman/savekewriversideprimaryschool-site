<title id="title">Petition counts do not reveal a success threshold</title><desc id="desc">Online petition counts were Oakfield 1,258, Brading 702, Godshill 493, Cowes 479, Arreton 445 and Wroxall 394. Cowes closed in August 2025; the other five proposals stopped. Paper signatures are recorded separately and not summed. The observations do not identify a petition’s causal effect or an effective threshold.</desc>
